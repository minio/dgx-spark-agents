# DeepSeek-V4-Flash served by vLLM on the two DGX Sparks. Only OpenClaw's Node
# runtime may reach it, and only this host and port.
id: spark-vllm
display_name: DGX Spark vLLM
description: OpenAI-compatible vLLM endpoint on the DGX Spark cluster
category: inference
inference_capable: true
credentials:
  - name: api_key
    description: vLLM API key
    env_vars: [VLLM_API_KEY]
    required: true
    auth_style: bearer
    header_name: authorization
discovery:
  credentials: [api_key]
endpoints:
  - host: 192.0.2.10  # replace with the address of the first DGX Spark, where vLLM listens
    port: 8000
    protocol: rest
    access: read-write
    enforcement: enforce
binaries: [/opt/node24/bin/node]
